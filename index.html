<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Registration Form</title>
    <link rel="stylesheet" href="styles.css"
</head>
<body>
    <h1>Registration Form</h1>
    <p>Please fill out this form with the required information</p>

    <form method="POST" action="https://register-demo.freecodecamp.org">
        <fieldset>
            <label for="first-name">
                Enter Your Name:
                <input id="first-name" name="first-name" type="text" required>
        </label>

        <label for="last-name">
            Enter Your Last Name:
            <input id="last-name" name="last-name" type="text" requied>
        </label>

        <label for="email">
            Enter Your Email:
            <input id="email" name="email" type="email" required>
        </label>

        <label for="new-password">
            Create a New Password:
            <input id="new-password" name="new-password" type="password" pattern="[a-z0-5]{8,}" required/>
        </label>
        </fieldset>

        <fieldset>
            <legend>Account type (required)</legend>
            <label for="personal-account">
                <input id="personal-account" type="radio" name="account-type" class="inline" checked>
                Personal
            </label>

            <label for="business-account">
                <input id="business-account" type="radio" name="account-type">
                Business
            </label>
        </fieldset>

        <fieldset>
            <label for="profile-picture">Upload a profile picture:
               <input id="profile-picture" type="file" name="file"/>
            </label>

            <label for="age">Input Your age(years):
                <input id="age" type="number" name="age" min="13" max="120"/>
            </label>

            <label for="referrer">How did you hear about us?
                <select id="referrer" name="referrer">
                    <option value="">(select one)</option>
                    <option value="1">FreeCodeCamp News</option>
                    <option value="2">FreeCodeCamp Youtube Channel</option>
                    <option value="3">FreeCodeCamp Forum</option>
                    <option value="4">Other</option>
                </select>
            </label>

            <label for="bio">Provide a bio:
                <textarea id="bio" name="bio" rows="3" cols="30" palceholder="I like coding on the beach..."></textarea>
            </label>
        </fieldset>
                <label for="terms-and-conditions">
                    <input class="inline" id="terms-and-conditions" type="checkbox" required name="terms-and-conditions"/>I accept the <a href="https:freecodecamp.org/news/terms-of-service/">terms and conditions</a>
                </label>
        <input type="submit" value="submit">
    </form>
</body>
</html>
